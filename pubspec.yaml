name: e_commerce_app
description: A Flutter E-Commerce application with authentication, product browsing and shopping cart.

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.0-171.0.dev


# ------------------packages--------------------
dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  http: ^1.1.0
  intl: ^0.18.1
  logger: ^2.0.1
  url_launcher: ^6.1.12

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.2

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1
  flutter_native_splash: ^2.4.6
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.2
  readmore: ^3.0.0

  # ----------product specifis------------




# ----/ packages end-----  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0




flutter:

  uses-material-design: true

  # ----local assets--------

 
  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
    - assets/banners/
    - assets/images/products/

    

 
